<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BAILA CONMIGO 6</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body {
      background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      text-align: center;
      padding: 20px;
    }
    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: bold;
      letter-spacing: 4px;
      background: linear-gradient(90deg, #ffd700, #ff6b00, #ff0066);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 1rem;
    }
    .subtitulo { font-size: 1.2rem; opacity: 0.8; margin-bottom: 2rem; }
    .contenedor { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; max-width: 800px; }
    .boton {
      padding: 1rem 2rem;
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,215,0,0.5);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 160px;
    }
    .boton:hover { background: rgba(255,215,0,0.2); border-color: #ffd700; transform: scale(1.05); }
  </style>
</head>
<body>
  <h1>BAILA CONMIGO</h1>
  <p class="subtitulo">Tu estudio de baile — Versión 6.0</p>
  
  <div class="contenedor">
    <button class="boton" onclick="ir('danzas')">💃 Danzas</button>
    <button class="boton" onclick="ir('video')">🎬 Generar Video</button>
    <button class="boton" onclick="ir('compartir')">📤 Compartir</button>
    <button class="boton" onclick="ir('estudio')">🎥 Estudio</button>
  </div>

  <script type="module">
    function ir(seccion) {
      alert('Abriendo: ' + seccion)
    }
  </script>
</body>
</html>
